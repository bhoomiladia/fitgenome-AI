[project]
name = "fitgenome-ai"
version = "0.1.0"
description = "FitGenome AI — Personalized fitness & nutrition platform backend"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.111,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "asyncpg>=0.29,<1.0",
    "alembic>=1.13,<2.0",
    "python-jose[cryptography]>=3.3,<4.0",
    "passlib[bcrypt]>=1.7,<2.0",
    "bcrypt>=4.0,<5.0",
    "pydantic-settings>=2.2,<3.0",
    "python-multipart>=0.0.9",
    "redis>=5.0,<6.0",
    "langchain>=0.2,<1.0",
    "langchain-openai>=0.1,<1.0",
    "langchain-pinecone>=0.2,<1.0",
    "pinecone-client>=5.0,<6.0",
    "tiktoken>=0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.4",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
