version: "3.9"

services:
  # ── FastAPI Application ─────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fitgenome-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - .:/app  # live-reload during development
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # ── PostgreSQL ──────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: fitgenome-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: fitgenome
      POSTGRES_PASSWORD: fitgenome_secret
      POSTGRES_DB: fitgenome_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitgenome -d fitgenome_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
